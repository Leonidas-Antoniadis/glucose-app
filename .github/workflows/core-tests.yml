name: Core tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: GlucoseCore on Linux
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: swift test --package-path Packages/GlucoseCore
