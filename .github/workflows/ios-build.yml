name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Packages/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec App/project.yml

      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project App/GlucoseApp.xcodeproj \
            -scheme GlucoseApp \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee xcodebuild.log | grep -E "error:|warning: .*GlucoseApp|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" xcodebuild.log

      - name: Package IPA for Sideloadly
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GlucoseApp.app Payload/
          zip -qry GlucoseApp-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: GlucoseApp-unsigned-ipa
          path: GlucoseApp-unsigned.ipa
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: xcodebuild-log
          path: xcodebuild.log
