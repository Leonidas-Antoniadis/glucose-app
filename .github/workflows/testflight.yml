name: TestFlight upload

# Optional: upload to TestFlight from GitHub, without a Mac.
# Runs only when started by hand (Actions → TestFlight upload → Run workflow) and needs these
# repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com/account → Membership)
#   ASC_KEY_ID           App Store Connect API key ID
#   ASC_ISSUER_ID        App Store Connect issuer ID
#   ASC_KEY_P8           Contents of the .p8 key file (Admin role, so Xcode can create signing certificates)
# Create the key at App Store Connect → Users and Access → Integrations → App Store Connect API.

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See the comments at the top of testflight.yml."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate --spec App/project.yml

      - name: Archive and upload
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          AUTH="-authenticationKeyPath $KEY_PATH -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild archive \
            -project App/GlucoseApp.xcodeproj -scheme GlucoseApp -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/GlucoseApp.xcarchive \
            -allowProvisioningUpdates $AUTH \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          xcodebuild -exportArchive -archivePath build/GlucoseApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates $AUTH
          rm -f "$KEY_PATH"
          echo "Uploaded build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: archive-log
          path: archive.log
