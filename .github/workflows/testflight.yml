name: TestFlight upload

# Uploads to TestFlight from GitHub, without a Mac. Runs on every push to main that changes
# the app, and by hand (Actions → TestFlight upload → Run workflow). Testers in an internal
# group with automatic distribution get each build a few minutes after processing.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID        10-character Team ID (developer.apple.com/account → Membership)
#   ASC_KEY_ID           App Store Connect API key ID
#   ASC_ISSUER_ID        App Store Connect issuer ID
#   ASC_KEY_P8           Contents of the .p8 key file (Admin role, for cloud distribution signing)
#   BUILD_CERT_P12       Base64 of an Apple Development certificate + private key (.p12)
#   BUILD_CERT_PASSWORD  Password of that .p12
# Create the key at App Store Connect → Users and Access → Integrations → App Store Connect API.
# A stored development certificate keeps Xcode from creating a new one on every run.

on:
  push:
    branches: [main]
    paths:
      - "App/**"
      - "Packages/**"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  # Bundle ID of the App Store Connect app. The app group stays as in project.yml.
  BUNDLE_ID: com.ncatechsolutions.glucoseapp

jobs:
  upload:
    if: github.repository == 'Leonidas-Antoniadis/glucose-app'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Check secrets
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY: ${{ secrets.ASC_KEY_P8 }}
          CERT: ${{ secrets.BUILD_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          missing=""
          [ -n "$TEAM" ] || missing="$missing APPLE_TEAM_ID"
          [ -n "$KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ISSUER" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$KEY" ] || missing="$missing ASC_KEY_P8"
          [ -n "$CERT" ] || missing="$missing BUILD_CERT_P12"
          [ -n "$CERT_PASSWORD" ] || missing="$missing BUILD_CERT_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See the comments at the top of testflight.yml."
            exit 1
          fi

      - uses: actions/checkout@v4

      # A build that breaks the alert logic but still compiles mustn't reach the phone.
      - name: Test GlucoseCore
        run: swift test --package-path Packages/GlucoseCore 2>&1 | tail -25; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER: com.leonidasantoniadis.glucoseapp/PRODUCT_BUNDLE_IDENTIFIER: $BUNDLE_ID/" App/project.yml
          xcodegen generate --spec App/project.yml

      - name: Install signing certificate
        env:
          CERT: ${{ secrets.BUILD_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.BUILD_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Archive and upload
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -o pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey_${KEY_ID}.p8"
          printf '%s' "$KEY_P8" > "$KEY_PATH"
          BUILD_NUMBER="$(date -u +%Y%m%d%H%M)"
          AUTH="-authenticationKeyPath $KEY_PATH -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID"
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild archive \
            -project App/GlucoseApp.xcodeproj -scheme GlucoseApp -configuration Release \
            -destination "generic/platform=iOS" -archivePath build/GlucoseApp.xcarchive \
            -allowProvisioningUpdates $AUTH \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log
          xcodebuild -exportArchive -archivePath build/GlucoseApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates $AUTH \
            | tee export.log | grep -E "error:|Upload succeeded|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" export.log
          echo "Uploaded build $BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testflight-logs
          path: |
            archive.log
            export.log
