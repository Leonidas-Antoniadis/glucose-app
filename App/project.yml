# XcodeGen spec. The .xcodeproj is generated in CI (and on any Mac) with:
#   xcodegen generate --spec App/project.yml
name: GlucoseApp
options:
  bundleIdPrefix: com.leonidasantoniadis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GlucoseCore:
    path: ../Packages/GlucoseCore

targets:
  GlucoseApp:
    type: application
    platform: iOS
    sources:
      - path: GlucoseApp
    dependencies:
      - package: GlucoseCore
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonidasantoniadis.glucoseapp
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Glucose
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # Added in phase 1 (sensor link):
        # INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription, NFC reader usage, UIBackgroundModes: bluetooth-central
