# XcodeGen spec. The .xcodeproj, Info.plist and entitlements files are generated in CI
# (and on any Mac) with:  xcodegen generate --spec App/project.yml
name: GlucoseApp
options:
  bundleIdPrefix: com.leonidasantoniadis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  GlucoseCore:
    path: ../Packages/GlucoseCore

settings:
  base:
    MARKETING_VERSION: "0.4.4"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  GlucoseApp:
    type: application
    platform: iOS
    sources:
      - path: GlucoseApp
      - path: Shared
    dependencies:
      - package: GlucoseCore
        product: GlucoseCore
      - package: GlucoseCore
        product: LibreProtocol
      - target: GlucoseWidget
    scheme: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonidasantoniadis.glucoseapp
    info:
      path: GlucoseApp/Info.plist
      properties:
        CFBundleDisplayName: Glucose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIBackgroundModes: [bluetooth-central, audio]
        NSBluetoothAlwaysUsageDescription: Glucose connects to your Libre sensor over Bluetooth to receive readings every minute.
        NFCReaderUsageDescription: Glucose reads your Libre sensor over NFC to pair with it and to fetch its history.
        NSFaceIDUsageDescription: Glucose can lock your health data behind Face ID.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        GLAppGroup: group.com.leonidasantoniadis.glucoseapp
    entitlements:
      path: GlucoseApp/GlucoseApp.entitlements
      properties:
        com.apple.developer.nfc.readersession.formats: [TAG]
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups: [group.com.leonidasantoniadis.glucoseapp]

  GlucoseWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: GlucoseWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leonidasantoniadis.glucoseapp.widget
    info:
      path: GlucoseWidget/Info.plist
      properties:
        CFBundleDisplayName: Glucose
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: GlucoseWidget/GlucoseWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.leonidasantoniadis.glucoseapp]
